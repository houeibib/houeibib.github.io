<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% if page.title_fr %}{{ page.title_fr }} · {% endif %}{{ site.title }}</title>
<script>
/* langue et thème choisis appliqués avant l'affichage (pas de clignotement) */
(function(){var l='fr';try{var s=localStorage.getItem('lang');if(s==='fr'||s==='en')l=s;}catch(e){}
  if(location.hash==='#en')l='en';if(location.hash==='#fr')l='fr';document.documentElement.lang=l;})();
/* thème : « auto » (pas d'attribut) suit le système ; « light » / « dark » forcés */
(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% if page.math %}<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">{% endif %}
</head>
<body>
{% include nav.html %}
{% if page.title_fr and page.header != false %}{% include page-header.html %}{% endif %}
<main>
{{ content }}
</main>
{% include footer.html %}
<script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
{% if page.math %}
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>renderMathInElement(document.querySelector('main'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});</script>
{% endif %}
</body>
</html>
